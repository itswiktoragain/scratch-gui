name: Pin modern horizontal catalogue

on:
  push:
    branches:
      - pin-modern-horizontal-catalogue

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pin-modern-horizontal-catalogue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin generated blocks build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['scratch-blocks'] = 'https://github.com/itswiktoragain/scratch-blocks/archive/829bb81ffbe9ae9492aea4575401a8c46cf2e7e8.tar.gz';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin modern horizontal block catalogue"
          git push origin HEAD:pin-modern-horizontal-catalogue
