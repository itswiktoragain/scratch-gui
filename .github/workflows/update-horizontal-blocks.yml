name: Refresh horizontal blocks pin

on:
  push:
    branches:
      - fix-horizontal-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-horizontal-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin fixed horizontal block build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.dependencies['scratch-blocks'] = 'https://github.com/itswiktoragain/scratch-blocks/archive/54bf92b01b7b193c49d7979c944758236109ba77.tar.gz';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency pin is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Pin fixed Dry Eggs horizontal blocks build'
          git push origin HEAD:fix-horizontal-runtime
