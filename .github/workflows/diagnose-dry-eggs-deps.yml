name: Diagnose Dry Eggs git dependencies

on:
  push:
    branches:
      - dry-eggs-v1
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        dependency:
          - github:itswiktoragain/scratch-vm#develop
          - github:itswiktoragain/scratch-blocks#develop-builds
          - github:itswiktoragain/scratch-render#develop
          - github:itswiktoragain/scratch-paint#develop
          - github:TurboWarp/scratch-audio#develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install one dependency
        env:
          DEPENDENCY: ${{ matrix.dependency }}
        run: |
          mkdir test-install
          cd test-install
          npm init -y >/dev/null
          npm install --no-save "$DEPENDENCY"
