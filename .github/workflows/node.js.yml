name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Verify complete horizontal block engine
      run: |
        node <<'NODE'
        const fs = require('fs');
        const packageData = require('./node_modules/scratch-blocks/package.json');
        if (packageData.browser !== './shim/horizontal.js') {
          throw new Error(`scratch-blocks is not using the horizontal browser shim: ${packageData.browser}`);
        }

        const catalogue = fs.readFileSync('node_modules/scratch-blocks/blocks_compressed_horizontal.js', 'utf8');
        const required = [
          'motion_movesteps',
          'looks_costume',
          'sound_sounds_menu',
          'sensing_of_object_menu',
          'operator_add',
          'data_variable',
          'procedures_call',
          'event_broadcast_menu',
          'event_broadcast',
          'event_whenbroadcastreceived'
        ];
        for (const name of required) {
          if (!catalogue.includes('Blockly.Blocks.' + name)) {
            throw new Error(`Installed horizontal block engine is missing ${name}`);
          }
        }

        const horizontalShim = fs.readFileSync('node_modules/scratch-blocks/shim/blocks_compressed_horizontal.js', 'utf8');
        if (!horizontalShim.includes('goog=./shim/blockly_compressed_horizontal.goog')) {
          throw new Error('Installed horizontal blocks shim is missing the Closure goog injection');
        }

        const entryShim = fs.readFileSync('node_modules/scratch-blocks/shim/horizontal.js', 'utf8');
        if (!entryShim.includes("require('./dry-eggs-horizontal-layout')(Blockly)")) {
          throw new Error('Installed horizontal entry shim is missing the Dry Eggs layout layer');
        }

        const layout = fs.readFileSync('node_modules/scratch-blocks/shim/dry-eggs-horizontal-layout.js', 'utf8');
        for (const token of [
          '__dryEggsHorizontalLayoutV3',
          'contentItems',
          'OUTPUT_SHAPE_HEXAGONAL',
          'OUTPUT_SHAPE_ROUND',
          'connection.setOffsetInBlock(localX, centerY)',
          'connection.moveToOffset(blockXY)',
          'if (targetConnection) connection.tighten_();',
          "shapes.push('boolean')",
          "shapes.push('round')"
        ]) {
          if (!layout.includes(token)) {
            throw new Error(`Installed horizontal layout is missing ${token}`);
          }
        }
        if (layout.includes('if (targetConnection) targetConnection.tighten_();')) {
          throw new Error('Installed horizontal layout still tightens inputs from the child connection');
        }

        const horizontalEvents = fs.readFileSync('node_modules/scratch-blocks/blocks_horizontal/event.js', 'utf8');
        for (const forbidden of [
          "Blockly.Blocks['event_broadcast']",
          "Blockly.Blocks['event_broadcastandwait']",
          "Blockly.Blocks['event_whenbroadcastreceived']"
        ]) {
          if (horizontalEvents.includes(forbidden)) {
            throw new Error(`Installed horizontal events override normal Scratch messaging: ${forbidden}`);
          }
        }

        const toolbox = fs.readFileSync('src/lib/make-toolbox-xml.js', 'utf8');
        const normalMessageShadows = (toolbox.match(/<shadow type="event_broadcast_menu"><\/shadow>/g) || []).length;
        if (normalMessageShadows !== 2) {
          throw new Error(`Expected 2 normal broadcast dropdown shadows, found ${normalMessageShadows}`);
        }
        if (toolbox.includes('<shadow type="math_number"><field name="NUM">1</field></shadow>')) {
          throw new Error('Numeric broadcast shadows are still present in the Dry Eggs toolbox');
        }

        console.log('Corrected Dry Eggs horizontal block engine verified.');
        NODE
    - run: npm run build
    - run: npm run test:unit
