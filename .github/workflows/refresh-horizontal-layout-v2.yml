name: Prepare horizontal layout v2

on:
  push:
    branches:
      - fix-horizontal-block-layout-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-horizontal-block-layout-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wait for fixed horizontal build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourceSha = '4837e8e967e3301db8c0ceec8c9b8cbb5291a067';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let buildSha = null;
            for (let attempt = 0; attempt < 60; attempt++) {
              const response = await fetch('https://api.github.com/repos/itswiktoragain/scratch-blocks/branches/develop-builds', {
                headers: {'User-Agent': 'dry-eggs-integration'}
              });
              if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
              const branch = await response.json();
              const message = branch.commit && branch.commit.commit && branch.commit.commit.message || '';
              if (message.includes(sourceSha)) {
                buildSha = branch.commit.sha;
                break;
              }
              console.log(`Waiting for develop-builds from ${sourceSha.slice(0, 8)}… current build is ${branch.commit.sha.slice(0, 8)}`);
              await sleep(5000);
            }
            if (!buildSha) throw new Error('Timed out waiting for the fixed horizontal develop-builds commit');
            fs.writeFileSync('/tmp/dry-eggs-blocks-sha', buildSha + '\n');
            console.log(`Using horizontal build ${buildSha}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Pin fixed blocks and VM
        run: |
          BLOCKS_SHA="$(cat /tmp/dry-eggs-blocks-sha)"
          BLOCKS_SHA="$BLOCKS_SHA" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          data.dependencies['scratch-blocks'] = `https://github.com/itswiktoragain/scratch-blocks/archive/${process.env.BLOCKS_SHA}.tar.gz`;
          data.dependencies['scratch-vm'] = 'https://github.com/itswiktoragain/scratch-vm/archive/d8570b5b3d6dd434da6a0256380be780368bbbd7.tar.gz';
          fs.writeFileSync('package.json', JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Replace message dropdown shadows with numbers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/lib/make-toolbox-xml.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldShadow = '<shadow type="event_broadcast_menu"></shadow>';
          const newShadow = '<shadow type="math_number"><field name="NUM">1</field></shadow>';
          const matches = source.split(oldShadow).length - 1;
          if (matches !== 2) {
            throw new Error(`Expected exactly 2 broadcast menu toolbox shadows, found ${matches}`);
          }
          source = source.split(oldShadow).join(newShadow);
          fs.writeFileSync(path, source);
          NODE
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/lib/make-toolbox-xml.js
          git commit -m 'Integrate modern horizontal block layout'
          git push origin HEAD:fix-horizontal-block-layout-v2
